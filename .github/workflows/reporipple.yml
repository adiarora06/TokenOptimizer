name: RepoRipple impact analysis

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      base:
        description: Optional Git revision to compare with the selected branch
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: reporipple-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze change impact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate RepoRipple reports
        id: reporipple
        uses: adiarora06/RepoRipple@1d4f761f6ba3c55f4fd0dc04e0147e0ce737b52c # v0.5.1 release source
        with:
          base: ${{ github.event.pull_request.base.sha || inputs.base || format('origin/{0}', github.event.repository.default_branch) }}
          reports-directory: reporipple-reports

      - name: Upload impact reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporipple-impact-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.reporipple.outputs.markdown-report }}
            ${{ steps.reporipple.outputs.json-report }}
          if-no-files-found: error
          retention-days: 14
